# MFA-Conformer baseline for Bridges-2, checkpoint-selected on official veri_test.
# Architecture: 6 Conformer blocks, 256-dim encoder, 4 heads, conv kernel 15, 192-dim embeddings.
model: MFA-CONFORMER
features: Fbank
criterion: AMSoftmax
adversarial_enabled: false
mixup: false
num_blocks: 6
encoder_dim: 256
attention_heads: 4
conformer_kernel_size: 15
embedding_dim: 192
dataset: null
vox1_wav_root: /ocean/projects/cis220031p/shared/raw/data/VoxCeleb1/wav
vox1_split_dir: /ocean/projects/cis220031p/shared/raw/data/VoxCeleb1/data
train_split_csv: /ocean/projects/cis220031p/shared/raw/data/VoxCeleb1/data/vox1_train.csv
val_split_csv: /ocean/projects/cis220031p/shared/raw/data/VoxCeleb1/data/vox1_val.csv
test_split_csv: /ocean/projects/cis220031p/shared/raw/data/VoxCeleb1/data/vox1_test.csv
active_split: train
derive_num_spk: true
num_spk: 942
USE_WANDB: true
wandb_project: caarma-baseline
title: caarma_baseline_mfa_conformer_veritest_selected
score_output_prefix: caarma_baseline_mfa_conformer_veritest_selected
init_lr: 0.001
epochs: 30
weight_decay: 0.0000001
trial_path: ../data/veri_test.txt
root: /ocean/projects/cis220031p/shared/raw/data/VoxCeleb1/wav
generate_validation_trials: false
validation_split: test
validation_trial_protocol: generated_cross_session
validation_max_speakers: 1000
validation_pos_pairs_per_speaker: 1
validation_neg_pairs_per_speaker: 1
warmup_step: 2000
batch_size: 200
num_workers: 4
val_num_workers: 4
train_drop_last: true
second: 3
do_augmentation: false
save_top_k: 3
validate_during_train: true
checkpoint_path: null
save_dir: ${PROJECT}/caarma-output/baseline-mfa-conformer-veritest-selected
devices: 1
